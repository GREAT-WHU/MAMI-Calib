Configor:
  DataStream:
    # Replace the topics and absolute intrinsic-file paths for your platform.
    IMUTopics:
      - key: /imu0/data
        value:
          Type: SENSOR_IMU
          Intrinsics: /absolute/path/to/imu0-intrinsics.yaml
      - key: /imu1/data
        value:
          Type: SENSOR_IMU
          Intrinsics: /absolute/path/to/imu1-intrinsics.yaml
    ReferIMU: /imu0/data
    BagPath: /absolute/path/to/multi_imu.bag
    BeginTime: -1
    Duration: -1
    OutputPath: /absolute/path/to/calibration-output

  Prior:
    GravityNorm: 9.81
    TimeOffsetPadding: 0.12
    KnotTimeDist:
      # These two legacy nominal spacings must match. When Adaptive is false,
      # they determine the fixed segment count in each WindowTime interval.
      SO3Spline: 0.02
      LinAcceSpline: 0.02
      Adaptive: true
      WindowTime: 0.08
      MinSegments: 2
      MaxSegments: 6
      # Saturation scales for the vector-valued sample standard deviations.
      GyroStdScale: 8.0
      AcceStdScale: 20.0
      GyroWeight: 0.7
      AcceWeight: 0.3
    Weight:
      AcceWeight: 1.0
      GyroWeight: 2.0

  Preference:
    UseCudaInSolving: false
    OutputParamInEachIter: false
    OutputBSplines: true
    OutputKinematics: true
    # 0: JSON, 1: XML, 2: YAML, 3: binary.
    OutputDataFormat: 2
    OptTemporalParams: true
    ThreadsToUse: -1
    ScaleSpline: 0.3
    ScaleCoord: 0.2
